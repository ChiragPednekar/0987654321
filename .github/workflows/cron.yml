name: Scheduled jobs

# Leaderboard rankings are driven by /api/cron/refresh-leaderboards.
# vercel.json registers it, but Vercel Cron is a paid feature — on Hobby the
# schedule is simply never invoked, and the symptom is silent: rankings quietly
# go stale. The library still works, so nothing looks broken.
#
# GitHub Actions schedules are free on public and private repositories alike, so
# this runs the same endpoint with the same shared secret. It is safe to have
# both: refresh_leaderboards() rebuilds from scratch, so a double invocation is
# a no-op rather than a duplicate.
#
# The weekly contest rollover used to run here too. Contests were removed from
# the product — /contests redirects to /cases and nothing links to them — so
# the schedule was creating rows every Friday that no page would ever show.
#
# Requires one repository secret:
#   CRON_SECRET  — the same value the deployment has
# and optionally:
#   SITE_URL     — defaults to the production domain below

on:
  schedule:
    # Rankings, daily at 03:00 UTC — matching vercel.json.
    - cron: "0 3 * * *"
    # The daily current-affairs quiz, at 00:30 UTC — 06:00 in India, so it is
    # there before anyone's morning and draws on the previous day's releases.
    - cron: "30 0 * * *"
  # So it can be run by hand after a deploy.
  workflow_dispatch:

jobs:
  run:
    # Two schedules share this workflow, so each job runs only on its own. A
    # manual dispatch runs both; each endpoint is idempotent.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh leaderboards
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://mableetcode.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # --fail turns a 401 or 500 into a red run rather than a silent pass.
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/refresh-leaderboards"
          echo

  daily-quiz:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Write the daily current-affairs quiz
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://mableetcode.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # 200 covers "published", "already published" and "too little news";
          # only a real failure is a 500 and turns the run red. The report is
          # printed so a quiet day can be told apart from a skipped one.
          curl --fail-with-body --silent --show-error --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/current-affairs"
          echo
