name: Scheduled jobs

# Leaderboards and the weekly contest rollover are driven by two endpoints
# under /api/cron. vercel.json registers them, but Vercel Cron is a paid
# feature — on Hobby the schedules are simply never invoked, and the symptom is
# silent: rankings quietly go stale and no contest is ever created. The library
# still works, so nothing looks broken.
#
# GitHub Actions schedules are free on public and private repositories alike, so
# this runs the same two endpoints with the same shared secret. It is safe to
# have both: refresh_leaderboards() rebuilds from scratch and the rollover
# refuses to open a second contest while one is already scheduled or running,
# so a double invocation is a no-op rather than a duplicate.
#
# Requires one repository secret:
#   CRON_SECRET  — the same value the deployment has
# and optionally:
#   SITE_URL     — defaults to the production domain below

on:
  schedule:
    # Rankings, daily at 03:00 UTC — matching vercel.json.
    - cron: "0 3 * * *"
    # Contest rollover, Fridays at 06:00 UTC — matching vercel.json.
    - cron: "0 6 * * 5"
  # So it can be run by hand after a deploy, or to seed the first contest.
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: both
        type: choice
        options: [both, leaderboards, contest]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh leaderboards
        if: github.event.schedule == '0 3 * * *' || inputs.job == 'both' || inputs.job == 'leaderboards'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://mableetcode.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # --fail turns a 401 or 500 into a red run rather than a silent pass.
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/refresh-leaderboards"
          echo

      - name: Weekly contest rollover
        if: github.event.schedule == '0 6 * * 5' || inputs.job == 'both' || inputs.job == 'contest'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://mableetcode.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/weekly-contest"
          echo
