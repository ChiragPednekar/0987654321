name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # @supabase/supabase-js 2.112 requires Node >= 22.
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # `database.ts` is hand-maintained, so the type checker cannot tell the
      # difference between a column that exists and one someone intended to
      # add. This compares what the code asks the database for against what the
      # migrations create.
      - run: npm run check:schema

      # The suite was never wired into CI, so the assertions covering grading
      # arithmetic, margin and the fair-use quota gated nothing. The
      # authorization suite skips itself unless TEST_BASE_URL and the Supabase
      # keys are present, so this stays offline and hermetic on a fork.
      - run: npm test

      - run: npm run build
        env:
          # The build only needs these to exist; pages that read real data are
          # server-rendered on demand, not prerendered.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
