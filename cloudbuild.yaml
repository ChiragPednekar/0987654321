# GitHub -> Cloud Build -> Artifact Registry -> Cloud Run
#
# Tests run before the image is built, and the build stops on failure, so a red
# test suite cannot reach production. This replaces Vercel's git-push deploy.
substitutions:
  _REGION: asia-south1
  _SERVICE: casecode
  _REPO: casecode

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: install
    name: node:22-alpine
    entrypoint: npm
    args: ["ci"]

  - id: verify
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        npx tsc --noEmit
        npx eslint --max-warnings=0
        npx vitest run
        npx tsx scripts/check-schema-refs.ts

  # NEXT_PUBLIC_* are inlined into the client bundle at build time, so they must
  # be present here — passing them only at runtime silently ships a bundle with
  # `undefined` baked in, which fails in the browser and not in CI.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build \
          --build-arg NEXT_PUBLIC_SITE_URL="$$NEXT_PUBLIC_SITE_URL" \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest .
    secretEnv: ["NEXT_PUBLIC_SITE_URL"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags",
           "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --quiet

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/next-public-site-url/versions/latest
      env: NEXT_PUBLIC_SITE_URL

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
timeout: 1800s
